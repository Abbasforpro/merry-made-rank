name: Daily rank check

on:
  schedule:
    - cron: "0 4 * * *" # 9:00 AM Pakistan time
  workflow_dispatch: {}
  push:
    branches: [claude/rank-tracker] # first run before merge; removed afterwards

permissions:
  contents: write

concurrency:
  group: rank-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check ranks
        env:
          # Optional repo secret. Without it the check goes through the Cloudflare connector.
          ETSY_KEY: ${{ secrets.ETSY_KEY }}
        run: node scripts/check-ranks.mjs
      - name: Save results
        run: |
          git config user.name "rank-tracker"
          git config user.email "rank-tracker@users.noreply.github.com"
          git add data/rank-history.csv data/rank-listings.json
          git diff --cached --quiet || git commit -m "Rank check $(TZ=Asia/Karachi date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
